---
# yaml-language-server: $schema=../schemas/host.schema.json

hostname_configure: true
hostname: "{{ inventory_hostname }}"

packages_install_shell: true
packages_install_network: true
packages_extra_list:
  - "cifs-utils"

dotfiles_enabled: true
dotfiles_deploy_args: "bash nano"

wg_enabled: true
# wg_address: "10.60.60.x02/32" Defined in inventory hosts.yml
wg_listen_port: 51820
wg_mtu: 1420
wg_interface: wg0
wg_peers:
  - name: flint
    public_key: "{{ lookup('env', 'WG_ROUTER_PUBLIC_KEY') }}"
    allowed_ips:
      - "10.60.60.1/32"

ssh_listen_addresses:
  - "{{ wg_address | ansible.utils.ipaddr('address') }}"
ssh_remove_dropins:
  - 99-ctrl.conf

firewall_enabled: true
firewall_trusted_interfaces:
  - "{{ wg_interface }}"
firewall_allow_tcp:
  - 443 # HAProxy on docker host port
firewall_allow_udp:
  - "{{ wg_listen_port }}"
firewall_forwarding: true # Needed for docker networking

docker_enabled: true
docker_dns_servers: []
docker_dns_search: []
docker_live_restore: true
docker_data_root: "/data/docker-data"
docker_containerd_root: "/data/containerd"
docker_wait_for_units:
  - "wg-quick@{{ wg_interface }}.service" # the relay's tunnel backend needs wg0 up before HAProxy starts
