---
# yaml-language-server: $schema=../schemas/host.schema.json

packages_fullupgrade: true

net_dns_configure: true
net_dns_mode: dhcp

users_list:
  - name: pggm95
    uid: 1000
    gid: 1000
    group: pggm95
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

samba_enabled: true
samba_existing_user: pggm95
samba_password: "{{ lookup('env', 'UNIVERSAL_PASS') }}"
smb_conf_file: "../files/smb-{{ lookup('env', 'MISE_ENV') }}.conf"
