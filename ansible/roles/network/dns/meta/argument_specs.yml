---
# ============================================================================
# DNS Role - Argument Specifications
# ============================================================================
# Provides IDE autocompletion and validation for role variables
# Run: ansible-doc -t role roles/network/dns

argument_specs:
  main:
    short_description: DNS resolver configuration, static or DHCP-driven
    description:
      - In static mode, writes the declared resolvers and auto-detects the
        management system (Tailscale, systemd-resolved, resolvconf, direct)
      - In DHCP mode, writes no resolver data; removes the writers that compete
        with the DHCP client for /etc/resolv.conf, then verifies the result
      - DHCP mode handles both stacks in use here, systemd-networkd on cloud
        image VMs and ifupdown with dhclient on Proxmox LXC templates

    options:
      # ========================================================================
      # DNS Configuration
      # ========================================================================
      net_dns_configure:
        description: Enable DNS resolver configuration
        type: bool
        default: false

      net_dns_mode:
        description: |
          Source of truth for resolution.
          static: net_dns_servers is written to the host.
          dhcp: the DHCP server owns resolution; nothing is written, competing
            writers are removed, and the result is verified. net_dns_servers,
            net_dns_search and net_dns_stub_resolver are ignored.
        type: str
        choices: [static, dhcp]
        default: static

      net_dns_servers:
        description: |
          DNS server IP addresses. Static mode only.
          Common choices:
            - Cloudflare: 1.1.1.1, 1.0.0.1
            - Quad9: 9.9.9.9, 149.112.112.112
            - Google: 8.8.8.8, 8.8.4.4
            - Mullvad: 194.242.2.2
        type: list
        elements: str
        default: []
      net_dns_search:
        description: DNS search domains for short hostname resolution
        type: list
        elements: str
        default: []
      net_dns_stub_resolver:
        description: |
          Enable systemd-resolved stub resolver (127.0.0.53).
          When true: /etc/resolv.conf → stub-resolv.conf
          When false: /etc/resolv.conf → resolv.conf (direct nameservers)
          Recommended: false for servers
        type: bool
        default: false

      net_dns_mdns:
        description: Enable Multicast DNS (mDNS) for local network name resolution
        type: bool
        default: false

      net_dns_llmnr:
        description: Enable Link-Local Multicast Name Resolution (LLMNR)
        type: bool
        default: false
