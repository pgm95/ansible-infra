---
# DNS resolver configuration.
#
# Two modes, selected by net_dns_mode:
#   static - the operator declares the resolvers (net_dns_servers) and this role
#            writes them, adapting to whichever resolver backend the host runs.
#   dhcp   - the DHCP server is the source of truth. This role writes no resolver
#            data at all; it only ensures nothing else on the host competes with
#            the DHCP client for /etc/resolv.conf, then verifies the result.

- name: DNS | Validate mode
  when: net_dns_configure | bool
  ansible.builtin.assert:
    that:
      - net_dns_mode in ['static', 'dhcp']
    fail_msg: >-
      net_dns_mode must be 'static' or 'dhcp'
      (got: {{ net_dns_mode | default('undefined') }}).
    quiet: true

- name: DNS | Apply static resolver configuration
  when:
    - net_dns_configure | bool
    - net_dns_mode == 'static'
  ansible.builtin.import_tasks: static.yml

- name: DNS | Apply DHCP-driven resolver configuration
  when:
    - net_dns_configure | bool
    - net_dns_mode == 'dhcp'
  ansible.builtin.import_tasks: dhcp.yml
