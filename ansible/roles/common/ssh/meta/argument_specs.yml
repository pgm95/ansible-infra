---
# ============================================================================
# SSH Role - Argument Specifications
# ============================================================================
# Provides IDE autocompletion and validation for role variables
# Run: ansible-doc -t role roles/common/ssh

argument_specs:
  main:
    short_description: SSH server hardening and authorized_keys deployment
    description:
      - Configures SSH security settings via drop-in file
      - Deploys authorized_keys to root and to users_list members with ssh_keys true
      - Supports authentication method control
      - Manages connection keepalive settings
      - Deploys to /etc/ssh/sshd_config.d/99-ansible.conf


    options:
      # ========================================================================
      # Authorized Keys
      # ========================================================================
      ssh_authorized_keys:
        description: SSH public keys deployed to root and to users with ssh_keys true
        type: list
        elements: str
        default: []

      # ========================================================================
      # Authentication Configuration
      # ========================================================================
      ssh_password_authentication:
        description: Enable/disable password authentication
        type: bool
        default: false

      ssh_pubkey_authentication:
        description: Enable/disable public key authentication
        type: bool
        default: true

      ssh_permit_empty_passwords:
        description: Allow empty passwords (security risk)
        type: bool
        default: false

      ssh_challenge_response_authentication:
        description: Enable/disable challenge-response authentication
        type: bool
        default: false

      # ========================================================================
      # Access Control
      # ========================================================================
      ssh_permit_root_login:
        description: "Root login method"
        type: str
        default: prohibit-password
        choices:
          - "yes"
          - "no"
          - prohibit-password
          - forced-commands-only

      ssh_use_pam:
        description: Enable/disable PAM authentication
        type: bool
        default: true

      ssh_max_auth_tries:
        description: Maximum authentication attempts per connection
        type: int
        default: 3

      # ========================================================================
      # Connection Management
      # ========================================================================
      ssh_client_alive_interval:
        description: Seconds between keepalive messages (0=disabled)
        type: int
        default: 300

      ssh_client_alive_count_max:
        description: Missed keepalives before disconnect
        type: int
        default: 2

      ssh_listen_addresses:
        description: |
          Restrict sshd to these addresses plus loopback, typically a tunnel
          address so management never touches the public interface. sshd binds
          only what is listed once any ListenAddress is set. Sets
          net.ipv4.ip_nonlocal_bind so the bind survives a boot where the
          interface comes up after sshd. Empty leaves sshd on all interfaces and
          removes any binding this role previously applied.
        type: list
        elements: str
        default: []
      ssh_remove_dropins:
        description: |
          File names under /etc/ssh/sshd_config.d to delete, for provider
          image drop-ins that re-enable password root login. Named
          explicitly so cloud-init's own drop-in is left alone. Applied
          after the keys are deployed, so a password-based first run keeps
          its session and every later connection authenticates with a key.
        type: list
        elements: str
        default: []
