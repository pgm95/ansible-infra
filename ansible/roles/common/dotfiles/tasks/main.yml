---
## Dotfiles deployment via the repository's own deploy.sh entrypoint
## The role handles transport (clone → sync → invoke); the script handles everything else.
## Hosts select components via dotfiles_components; file content lives in the dotfiles repo.

# ========================================================================
# Phase 1: Clone/Update Repository on Control Node
# ========================================================================

- name: Dotfiles | Ensure local cache directory exists
  ansible.builtin.file:
    path: "{{ dotfiles_cache_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true
  when: dotfiles_enabled | bool

- name: Dotfiles | Clone or update dotfiles repository
  ansible.builtin.git:
    repo: "https://oauth2:{{ dotfiles_github_token }}@{{ dotfiles_repo_url | regex_replace('^https://', '') }}"
    dest: "{{ dotfiles_cache_dir }}"
    version: "{{ dotfiles_repo_branch }}"
    update: true
    force: "{{ dotfiles_force_update }}"
  delegate_to: localhost
  become: false
  when:
    - dotfiles_enabled | bool
    - not ansible_check_mode
  run_once: true
  register: __git_result
  changed_when: __git_result.changed and (__git_result.before | default('') != __git_result.after | default(''))
  failed_when:
    - __git_result.failed | default(false)
    - not dotfiles_continue_on_error
  no_log: true

# ============================================================================
# Validation (outside the block: a bad list must fail even with continue_on_error)
# ============================================================================

- name: Dotfiles | Require at least one component
  ansible.builtin.assert:
    that: dotfiles_components | length > 0
    fail_msg: >-
      dotfiles_components is empty. List the components for this host in
      host_vars, or set dotfiles_enabled to false.
    quiet: true
  when: dotfiles_enabled | bool

- name: Dotfiles | Find components in the cached repository
  ansible.builtin.find:
    paths: "{{ dotfiles_cache_dir }}/dotfiles"
    file_type: directory
    recurse: false
  delegate_to: localhost
  become: false
  check_mode: false
  when: dotfiles_enabled | bool
  register: __dotfiles_home

# A first --check has no cache to compare against; deploy.sh still validates.
- name: Dotfiles | Validate components
  ansible.builtin.assert:
    that: __dotfiles_unknown | length == 0
    fail_msg: >-
      Unknown dotfiles components: {{ __dotfiles_unknown | join(', ') }}
      (available: {{ __dotfiles_available | join(', ') }}).
    quiet: true
  vars:
    __dotfiles_available: "{{ __dotfiles_home.files | map(attribute='path') | map('basename') | sort }}"
    __dotfiles_unknown: "{{ dotfiles_components | difference(__dotfiles_available) | difference(['all']) }}"
  when:
    - dotfiles_enabled | bool
    - __dotfiles_home.matched > 0

- name: Dotfiles deployment
  when: dotfiles_enabled | bool
  block:
    # ========================================================================
    # Phase 2: Sync Repository to Remote Host
    # ========================================================================

    - name: Dotfiles | Ensure remote staging directory exists
      ansible.builtin.file:
        path: "{{ dotfiles_staging_dir }}"
        state: directory
        mode: "0755" # synchronize applies the source directory's mode

    - name: Dotfiles | Synchronize repository to remote staging directory
      ansible.posix.synchronize:
        src: "{{ dotfiles_cache_dir }}/"
        dest: "{{ dotfiles_staging_dir }}/"
        archive: true
        checksum: true
        delete: true
        recursive: true
        owner: false
        group: false
        rsync_opts:
          - "--exclude=.git"
      when: not ansible_check_mode

    # Root runs deploy.sh from here, so no other uid may own these files.
    - name: Dotfiles | Ensure root owns the staged repository
      ansible.builtin.file:
        path: "{{ dotfiles_staging_dir }}"
        state: directory
        owner: root
        group: root
        recurse: true

    # ========================================================================
    # Phase 3: Resolve Targets
    # ========================================================================

    - name: Dotfiles | Build deploy.sh arguments
      ansible.builtin.set_fact:
        __dotfiles_args: "--json --components {{ dotfiles_components | join(',') }}"

    - name: Dotfiles | Identify users with home directories
      ansible.builtin.set_fact:
        __target_users: >-
          {{
            users_list
            | selectattr('name', 'defined')
            | selectattr('create_home', 'undefined')
            | list
            +
            users_list
            | selectattr('name', 'defined')
            | selectattr('create_home', 'defined')
            | selectattr('create_home', 'equalto', true)
            | list
          }}
      when:
        - dotfiles_deploy_to_users | bool
        - users_list | default([]) | length > 0

    # ========================================================================
    # Phase 4: Apply
    # ========================================================================

    - name: Dotfiles | Apply for root
      ansible.builtin.command:
        cmd: "bash {{ dotfiles_staging_dir }}/deploy.sh apply {{ __dotfiles_args }}"
      when:
        - dotfiles_deploy_to_root | bool
        - not ansible_check_mode
      register: __dotfiles_root
      changed_when: __dotfiles_root.rc == 0 and (__dotfiles_root.stdout | from_json).changed

    - name: Dotfiles | Apply for each user
      ansible.builtin.command:
        cmd: >-
          bash {{ dotfiles_staging_dir }}/deploy.sh apply
          --home {{ item.home | default('/home/' ~ item.name) }}
          {{ __dotfiles_args }}
      loop: "{{ __target_users | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: not ansible_check_mode
      register: __dotfiles_users
      changed_when: __dotfiles_users.rc == 0 and (__dotfiles_users.stdout | from_json).changed

    - name: Dotfiles | Fix ownership for user home directories
      ansible.builtin.file:
        path: "{{ item.home | default('/home/' ~ item.name) }}"
        owner: "{{ item.name }}"
        group: "{{ item.group | default(item.name) }}"
        recurse: true
      loop: "{{ __target_users | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: not ansible_check_mode
      changed_when: false

    # ========================================================================
    # Phase 5: Drift Report (check mode only, read-only)
    # ========================================================================
    # Compares each home against the source from the last apply. The staging
    # directory is persistent for this reason: a dry run must not sync to the host.

    - name: Dotfiles | Look for a previously deployed source
      ansible.builtin.stat:
        path: "{{ dotfiles_staging_dir }}/deploy.sh"
      check_mode: false
      when: ansible_check_mode
      register: __dotfiles_source

    - name: Dotfiles | Report hosts with nothing to compare
      ansible.builtin.debug:
        msg: "WARNING: no dotfiles source in {{ dotfiles_staging_dir }}; drift cannot be checked until the next deploy"
      when:
        - ansible_check_mode
        - not __dotfiles_source.stat.exists

    - name: Dotfiles | Check drift for root
      ansible.builtin.command:
        cmd: "bash {{ dotfiles_staging_dir }}/deploy.sh check {{ __dotfiles_args }}"
      check_mode: false
      when:
        - ansible_check_mode
        - __dotfiles_source.stat.exists
        - dotfiles_deploy_to_root | bool
      register: __dotfiles_drift_root
      changed_when: __dotfiles_drift_root.rc == 1
      failed_when: __dotfiles_drift_root.rc not in [0, 1]

    - name: Dotfiles | Check drift for each user
      ansible.builtin.command:
        cmd: >-
          bash {{ dotfiles_staging_dir }}/deploy.sh check
          --home {{ item.home | default('/home/' ~ item.name) }}
          {{ __dotfiles_args }}
      loop: "{{ __target_users | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      check_mode: false
      when:
        - ansible_check_mode
        - __dotfiles_source.stat.exists
      register: __dotfiles_drift_users
      changed_when: __dotfiles_drift_users.rc == 1
      failed_when: __dotfiles_drift_users.rc not in [0, 1]

    - name: Dotfiles | Show drifted root files
      ansible.builtin.debug:
        msg: "WARNING: dotfiles drift: {{ (__dotfiles_drift_root.stdout | from_json).files | join(', ') }}"
      when:
        - ansible_check_mode
        - __dotfiles_drift_root.rc | default(0) == 1

    - name: Dotfiles | Show drifted user files
      ansible.builtin.debug:
        msg: "WARNING: dotfiles drift for {{ item.item.name }}: {{ (item.stdout | from_json).files | join(', ') }}"
      loop: "{{ __dotfiles_drift_users.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - ansible_check_mode
        - item.rc | default(0) == 1

  rescue:
    - name: Dotfiles | Log deployment failure
      ansible.builtin.debug:
        msg: "Dotfiles deployment failed but continuing (dotfiles_continue_on_error is true)"
      when: dotfiles_continue_on_error | bool

    - name: Dotfiles | Fail if not configured to continue
      ansible.builtin.fail:
        msg: "Dotfiles deployment failed and dotfiles_continue_on_error is false"
      when: not dotfiles_continue_on_error | bool
