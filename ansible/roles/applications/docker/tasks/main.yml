---
# ============================================================================
# Docker Role - Installation and Configuration
# ============================================================================
# Installs Docker CE from official repository with comprehensive configuration

# ============================================================================
# Pre-Installation Validation
# ============================================================================

- name: Gather facts from target host
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - distribution
      - distribution_release
      - architecture
  # distribution/architecture facts are prerequisites for every subtag below.
  tags: [docker_install, docker_daemon, docker_gpu]

- name: Validate target OS is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] is defined
      - ansible_facts['distribution'] | lower in ['debian', 'ubuntu']
    fail_msg: >-
      Unsupported OS detected: {{ ansible_facts.get('distribution', 'unknown') }}.
      This role only supports Debian and Ubuntu. Use a supported distribution
      or install Docker manually.
    success_msg: "Target OS validated: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_release'] }}"
  tags: [docker_install, docker_daemon, docker_gpu]

# ============================================================================
# Docker Installation
# ============================================================================

- name: Docker installation workflow
  tags: [docker_install]
  block:
    - name: Set Docker distribution name
      ansible.builtin.set_fact:
        __docker_distribution: "{{ ansible_facts['distribution'] | lower }}"

    - name: Determine Docker architecture
      ansible.builtin.set_fact:
        __docker_arch: >-
          {{ 'amd64' if ansible_facts['architecture'] == 'x86_64'
             else 'arm64' if ansible_facts['architecture'] == 'aarch64'
             else ansible_facts['architecture'] }}

    - name: Add Docker repository and GPG key
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/{{ __docker_distribution }}"
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: [stable]
        architectures: "{{ __docker_arch }}"
        signed_by: "https://download.docker.com/linux/{{ __docker_distribution }}/gpg"
        state: present
      register: __repo_result

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true

    # Symmetric: true -> hold, false -> install (releases any existing hold).
    # Idempotent metadata-only operation; safe to re-apply on every run.
    - name: Set Docker package hold state
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: "{{ docker_packages_hold | ternary('hold', 'install') }}"
      loop: "{{ docker_packages }}"

  rescue:
    - name: Display installation error
      ansible.builtin.debug:
        msg:
          - "Docker installation failed"
          - "Distribution: {{ __docker_distribution | default('unknown') }}"
          - "Architecture: {{ __docker_arch | default('unknown') }}"
          - "Repository status: {{ 'added' if __repo_result is defined and __repo_result is succeeded else 'failed' }}"

    - name: Cleanup on failure - Remove broken repository
      ansible.builtin.deb822_repository:
        name: docker
        state: absent
      when: __repo_result is defined and __repo_result is failed
      failed_when: false

    - name: Fail with actionable message
      ansible.builtin.fail:
        msg: >-
          Docker installation failed (distribution={{ __docker_distribution | default('unknown') }},
          release={{ ansible_facts['distribution_release'] }}). Check network to
          download.docker.com, verify the distribution release is supported, and
          re-run after resolving.

# ============================================================================
# Docker Configuration
# ============================================================================
# In check mode on unprovisioned hosts, Docker is not yet installed (the
# install block above only reports what would change). Skip configuration
# tasks that require Docker to be present (/etc/docker/, docker.service).
# On already-provisioned hosts, check mode still validates config drift.

- name: Check if Docker is installed
  ansible.builtin.stat:
    path: /usr/bin/dockerd
  register: __docker_installed
  tags: [docker_daemon, docker_gpu]

- name: Install AMD container toolkit
  ansible.builtin.include_tasks:
    file: gpu.yml
    apply:
      tags: [docker_gpu]
  when:
    - docker_amd_ctk_enabled
    - not ansible_check_mode or __docker_installed.stat.exists
  tags: [docker_gpu]

- name: Configure Docker (requires Docker present outside check mode)
  when: not ansible_check_mode or __docker_installed.stat.exists
  tags: [docker_daemon]
  block:
    - name: Build daemon config
      ansible.builtin.include_tasks:
        file: daemon.yml
        apply:
          tags: [docker_daemon]

    - name: Configure Docker daemon
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: "{{ _docker_daemon_config | to_nice_json }}\n"
        mode: "0644"
        backup: true
      notify: Docker | Restart docker

    - name: Set containerd root directory
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^#?root\s*='
        line: 'root = "{{ docker_containerd_root }}"'
        insertafter: '^disabled_plugins'
        backup: true
      notify: Docker | Restart containerd
      when: docker_containerd_root | default('') | length > 0

    - name: Ensure systemd drop-in directories exist
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}.service.d"
        state: directory
        mode: "0755"
      loop: [containerd, docker]

    # Order each daemon after the mount that provides its state directory.
    # RequiresMountsFor adds After= and Requires= on the mount unit, so a
    # daemon never starts on the root disk under an unmounted `nofail` data
    # mount, and fails visibly if the disk is missing. Reload only: ordering
    # is read at activation, a restart would bounce every container.
    - name: Docker | Order daemons after their data mounts
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.unit }}.service.d/data-root.conf"
        content: |
          [Unit]
          RequiresMountsFor={{ item.root }}
        mode: "0644"
        backup: true
      loop:
        - { unit: containerd, root: "{{ docker_containerd_root }}" }
        - { unit: docker, root: "{{ docker_data_root }}" }
      loop_control:
        label: "{{ item.unit }}"
      when: item.root | length > 0
      notify: Docker | Reload systemd

    - name: Docker | Remove data mount ordering where no root is set
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item.unit }}.service.d/data-root.conf"
        state: absent
      loop:
        - { unit: containerd, root: "{{ docker_containerd_root }}" }
        - { unit: docker, root: "{{ docker_data_root }}" }
      loop_control:
        label: "{{ item.unit }}"
      when: item.root | length == 0
      notify: Docker | Reload systemd

    # Boot ordering only. Wants= (not Requires=) so a tailscaled restart or
    # package upgrade does not propagate a stop/restart to docker.service and
    # bounce every container. daemon_reload on the start task below applies it.
    - name: Install wait-for-tailscale systemd drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker.service.d/wait-for-tailscale.conf
        content: |
          [Unit]
          After=tailscaled.service
          Wants=tailscaled.service
        mode: "0644"
        backup: true
      when: docker_wait_for_tailscale

    - name: Remove wait-for-tailscale systemd drop-in
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d/wait-for-tailscale.conf
        state: absent
      when: not docker_wait_for_tailscale

    - name: Start and enable Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started
        daemon_reload: true

    # On a first provisioning the package install starts both daemons on their
    # default roots before daemon.json and config.toml exist. Flush the restart
    # handlers now so the guard below inspects the daemons on their configured
    # roots, not the ones the package started.
    - name: Apply pending daemon restarts before verifying
      ansible.builtin.meta: flush_handlers

    - name: Verify daemon state lives on the configured mounts
      ansible.builtin.include_tasks:
        file: verify.yml
        apply:
          tags: [docker_daemon]

- name: Display Docker configuration summary
  ansible.builtin.debug:
    msg:
      - "Docker installed and configured successfully"
      - "  - Data root: {{ docker_data_root if docker_data_root else 'docker default' }}"
      - "  - Containerd root: {{ docker_containerd_root if docker_containerd_root else 'containerd default' }}"
      - "  - Storage driver: {{ docker_storage_driver if docker_storage_driver else 'auto' }}"
      - "  - MTU: {{ docker_mtu if docker_mtu > 0 else 'auto' }}"
      - "  - Log driver: {{ docker_log_driver }}"
      - "  - Swarm enabled: {{ docker_swarm_enabled }}"
    verbosity: 1
