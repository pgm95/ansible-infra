---
# Bind sshd to the declared Tailscale IP + loopback.
#
# The address is tailscale_ip (validated and API-assigned by this role), not the
# live daemon's address, so the result is deterministic and renders under
# --check --diff.
#
# At boot sshd can start before tailscaled has assigned the address. OpenSSH
# aborts only when every ListenAddress fails, so the Tailscale bind fails, the
# loopback bind succeeds, and sshd runs unreachable with a healthy unit status.
# ip_nonlocal_bind lets the bind succeed before the address exists; connections
# arrive once tailscaled brings it up. Unit ordering cannot solve this: After=
# waits for the daemon, not the address, and Requires= would tie sshd to
# tailscaled health.

- name: Tailscale | Configure SSH binding
  when: tailscale_bind_ssh | bool
  block:
    - name: Tailscale | Validate SSH binding has an address
      ansible.builtin.assert:
        that:
          - _ts_ip | length > 0
        fail_msg: >-
          tailscale_bind_ssh is enabled but tailscale_ip is not set, so sshd has
          no Tailscale address to bind. Set tailscale_ip in
          host_vars/{{ inventory_hostname }}.yml.
        success_msg: "SSH binding address: {{ _ts_ip }}"
        quiet: true

    - name: Tailscale | Allow sshd to bind the Tailscale address before it exists
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-tailscale-ssh.conf
        content: |
          # Ansible managed - Tailscale SSH binding
          # Host-wide: any process may bind an address the host does not own yet.
          net.ipv4.ip_nonlocal_bind = 1
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: Tailscale | Apply SSH binding sysctl

    - name: Tailscale | Create sshd drop-in for Tailscale binding
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/55-tailscale.conf
        content: |
          # Ansible managed - Tailscale SSH binding
          # Restricts sshd to the Tailscale network + localhost

          ListenAddress {{ _ts_ip }}:22
          ListenAddress 127.0.0.1:22
        owner: root
        group: root
        mode: "0644"
        backup: true
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Tailscale | Restart sshd

- name: Tailscale | Remove SSH binding
  when: not tailscale_bind_ssh | bool
  block:
    - name: Tailscale | Remove sshd drop-in
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/55-tailscale.conf
        state: absent
      notify: Tailscale | Restart sshd

    - name: Tailscale | Remove non-local bind sysctl
      ansible.builtin.file:
        path: /etc/sysctl.d/99-tailscale-ssh.conf
        state: absent
      notify: Tailscale | Reset SSH binding sysctl

- name: Tailscale | Apply pending sshd changes now
  ansible.builtin.meta: flush_handlers

- name: Tailscale | Read sshd listeners
  ansible.builtin.command: ss -Hltn sport = :22
  register: __ts_ssh_listeners
  changed_when: false
  check_mode: false

- name: Tailscale | Report sshd listeners
  ansible.builtin.debug:
    msg: "sshd listening on: {{ __ts_ssh_listeners.stdout_lines | map('split') | map(attribute=3) | join(', ') }}"

- name: Tailscale | Verify sshd listens on the Tailscale address
  ansible.builtin.assert:
    that:
      - (_ts_ip ~ ':22') in __ts_ssh_listeners.stdout
      - "'127.0.0.1:22' in __ts_ssh_listeners.stdout"
    fail_msg: >-
      sshd is not listening on {{ _ts_ip }}:22 after restart
      (got: {{ __ts_ssh_listeners.stdout_lines | map('split') | map(attribute=3) | join(', ') }}).
      Check the sshd journal for a bind failure.
    success_msg: "sshd bound to {{ _ts_ip }}:22 and 127.0.0.1:22"
    quiet: true
  when:
    - tailscale_bind_ssh | bool
    - not ansible_check_mode
