[defaults]
# Paths set via env vars in .mise/config.toml

# General
forks = 5
remote_tmp = ~/.ansible/tmp
interpreter_python = auto_silent
inject_facts_as_vars = False
deprecation_warnings = True

# Trusted network with pre-deployed SSH keys via cloud-init
host_key_checking = False
retry_files_enabled = False

# Performance
gathering = smart
fact_caching = jsonfile
fact_caching_timeout = 86400

# Output
force_color = True
callback_result_format = yaml
stdout_callback = default
; bin_ansible_callbacks = True
; callbacks_enabled = timer, profile_tasks, profile_roles

[ssh_connection]
pipelining = True
# Keepalives make a session that died under us (guest rebooted mid-play, e.g.
# cloud-init's first-boot upgrade reboot) fail within ~45s instead of hanging.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=3
