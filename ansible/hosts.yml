---
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    vps:
      hosts:
        swarm-vps:
          env_scope: prod
          wg_address: "10.60.60.102/32"
        swarm-vps-dev:
          env_scope: dev
          wg_address: "10.60.60.202/32"
    lxc:
      hosts:
        docker-lxc:
          env_scope: prod
        fileserver:
          env_scope: prod
        fileserver-dev:
          env_scope: dev
    vm:
      hosts:
        swarm-vm:
          env_scope: prod
        swarm-vm-dev:
          env_scope: dev
        swarm-gpu:
          env_scope: prod
        swarm-gpu-dev:
          env_scope: dev
        swarm-qdevice:
          env_scope: prod
        swarm-qdevice-dev:
          env_scope: dev
    swarm: {} # Dynamic group populated by discover_swarm.yml
