---
# VM Provisioning Playbook
#
# Provisions VMs via SSH with base system and applications.
# Guest lifecycle (create/destroy) is managed by Terraform.

- name: Provision VMs
  hosts: vm
  gather_facts: false

  pre_tasks:
    - name: Filter by environment
      ansible.builtin.import_tasks: tasks/filter_env.yml
    # Terraform returns once the guest agent reports an address, which on a
    # fresh VM is before cloud-init has finished (and before its post-upgrade
    # reboot). Block until cloud-init is done so a deploy right after tf:apply
    # never provisions a half-initialised root.
    # Exit 2 is "done with recoverable errors" (a warning in a module), which
    # still means cloud-init has finished; only a real error (1) should stop us.
    - name: Wait for cloud-init to finish
      ansible.builtin.command:
        cmd: cloud-init status --wait
      register: __cloud_init_status
      changed_when: false
      failed_when: __cloud_init_status.rc not in [0, 2]
      check_mode: false
      tags: [always]
    - name: Gather facts after environment filter
      ansible.builtin.setup:
      tags: [always]

  roles:
    - role: common/users
      tags: [users]
      when: users_list is defined and users_list | length > 0
    - role: common/ssh
      tags: [ssh]
    - role: common/packages
      tags: [packages]
    - role: common/timezone
      tags: [timezone]
    - role: common/firmware
      tags: [firmware]
      when: firmware_enabled
    - role: network/dns
      tags: [dns]
    - role: network/ntp
      tags: [ntp]
    - role: common/dotfiles
      tags: [dotfiles]
      when: dotfiles_enabled
    - role: applications/tailscale
      tags: [tailscale]
      when:
        - tailscale_enabled
    - role: applications/docker
      tags: [docker]
      when: docker_enabled
    - role: applications/samba
      tags: [samba]
      when: samba_enabled
